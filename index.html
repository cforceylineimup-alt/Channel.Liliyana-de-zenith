<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Saluran Liliyana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#000; --panel:#0a0a0a; --panel2:#131313; --line:#1d1d1d;
  --blue:#2aabee; --blue-d:#1d8fd1; --bubble:#0f2234;
  --text:#f4f7fa; --sub:#7d8b98; --hover:#151b21; --danger:#ff595a;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:#000;color:var(--text);font-family:Roboto,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{fill:currentColor;width:24px;height:24px;flex:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Auth ---------- */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#000;overflow:auto;z-index:50}
.acard{width:100%;max-width:360px;text-align:center;margin:auto}
.logo{width:120px;height:120px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin:0 auto 26px}
.logo svg{width:62px;height:62px;fill:#fff;margin-right:4px}
.acard h1{font-size:30px;font-weight:500}
.acard .sub{color:var(--sub);margin:12px 0 26px;line-height:1.5}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:500;background:var(--blue);color:#fff;margin-top:14px;transition:background .15s}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:none;color:var(--blue)}
.btn.ghost:hover{background:#2aabee14}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{flex:1;padding:12px;color:var(--sub);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.field{position:relative;margin-top:14px;text-align:left}
.field input,.field textarea{width:100%;background:transparent;border:1px solid #2b2b2b;border-radius:12px;padding:20px 14px 8px;color:#fff;font:inherit;outline:0;resize:none;transition:border-color .15s}
.field textarea{min-height:92px}
.field label{position:absolute;left:15px;top:15px;color:var(--sub);pointer-events:none;transition:.15s}
.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.field input:focus+label,.field input:not(:placeholder-shown)+label,
.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{top:5px;font-size:11px}
.field input:focus+label,.field textarea:focus+label{color:var(--blue)}
.field input:disabled{color:var(--sub)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:12px;text-align:left}
.hint{color:var(--sub);font-size:12.5px;margin-top:14px;line-height:1.5}

/* ---------- App layout ---------- */
#app{display:flex;height:100%;background:var(--bg)}
#sidebar{width:380px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:8px;padding:8px 10px;height:56px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none;transition:background .15s}
.ib:hover{background:#ffffff12}
.sbox{flex:1;background:var(--panel2);border-radius:22px;display:flex;align-items:center;padding:0 12px;height:40px;gap:8px;border:1px solid transparent}
.sbox:focus-within{border-color:var(--blue)}
.sbox svg{width:20px;height:20px;color:var(--sub)}
.sbox input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;min-width:0}
#list{flex:1;overflow-y:auto;padding:4px 0}
.av{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:500;color:#fff;overflow:hidden;font-size:19px;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:42px;height:42px;font-size:15px}
.av.xl{width:120px;height:120px;font-size:42px}
.ci{display:flex;gap:12px;padding:9px 10px;margin:2px 8px;border-radius:12px;cursor:pointer;align-items:center}
.ci:hover{background:var(--hover)}
.ci.active{background:var(--blue-d)}
.ci .mid{flex:1;min-width:0}
.ci .r1{display:flex;align-items:center;gap:6px}
.ci .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;min-width:0}
.ci .nm svg{width:16px;height:16px;color:var(--sub)}
.ci .tm{margin-left:auto;font-size:12px;color:var(--sub);flex:none}
.ci .pv{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-size:14px}
.ci.active .tm,.ci.active .pv,.ci.active .nm svg{color:#ffffffcc}
.empty{color:var(--sub);text-align:center;padding:40px 20px}

#chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:#000}
#noChat{flex:1;display:grid;place-items:center;color:var(--sub)}
#noChat span{background:#ffffff0f;padding:6px 14px;border-radius:16px;font-size:14px}
#chatMain{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:6px;padding:6px 10px;height:56px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;padding:2px 6px;border-radius:10px;text-align:left}
.top .who .t{min-width:0}
.top .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{font-size:13px;color:var(--sub)}
#backBtn{display:none}
#searchbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#searchbar input{flex:1;background:var(--panel2);border:1px solid transparent;border-radius:20px;padding:9px 14px;color:#fff;font:inherit;outline:0}
#searchbar input:focus{border-color:var(--blue)}
#searchbar .cnt{color:var(--sub);font-size:13px}
#pinbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer}
#pinbar .bar{width:2px;align-self:stretch;background:var(--blue);border-radius:2px}
#pinbar .pt{font-size:13px;color:var(--blue);font-weight:500}
#pinbar .px{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pinbar .pm{flex:1;min-width:0}
#feed{flex:1;overflow-y:auto;padding:10px 12px 14px;background:
  radial-gradient(circle at 18% 12%,#0a2a4030,transparent 42%),
  radial-gradient(circle at 85% 88%,#1a3a5c26,transparent 46%),#000}
.wrap{max-width:728px;margin:0 auto}
.day{display:flex;justify-content:center;margin:12px 0 8px;position:sticky;top:0;z-index:2}
.day span{background:#1a2a3acc;backdrop-filter:blur(8px);padding:3px 12px;border-radius:14px;font-size:13px;font-weight:500;color:#dbe9f5}
.msg{display:flex;margin:4px 0}
.bubble{background:var(--bubble);border-radius:14px 14px 14px 4px;padding:7px 11px 5px;max-width:min(480px,92%);overflow-wrap:anywhere;position:relative;min-width:90px;user-select:text}
.bubble.has-img{padding:3px 3px 5px;width:min(480px,92%)}
.bubble .txt{white-space:pre-wrap;line-height:1.42}
.bubble.has-img .txt{padding:6px 9px 0}
.pimg{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:11px;cursor:zoom-in}
.bubble a{color:#6cc4f5;text-decoration:none}
.bubble a:hover{text-decoration:underline}
mark{background:#2aabee55;color:#fff;border-radius:3px}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:12px;color:#8fa6ba;margin-top:3px;padding-right:4px}
.meta svg{width:14px;height:14px}
.meta .pn svg{width:12px;height:12px}
.msg.flash .bubble{animation:flash 1.2s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px #2aabee88}100%{box-shadow:0 0 0 3px transparent}}

#composer{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px}
.cwrap{max-width:728px;margin:0 auto}
#editBar,#imgPrev{display:flex;align-items:center;gap:10px;padding:4px 6px 8px}
#editBar .bar{width:2px;align-self:stretch;background:var(--blue)}
#editBar .et{flex:1;min-width:0}
#editBar .et b{display:block;color:var(--blue);font-weight:500;font-size:13px}
#editBar .et span{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
#imgPrev img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.crow{display:flex;align-items:flex-end;gap:8px}
.cbox{flex:1;display:flex;align-items:flex-end;background:var(--panel2);border-radius:22px;padding:2px 4px;border:1px solid transparent;min-width:0}
.cbox:focus-within{border-color:#2aabee66}
.cbox textarea{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;resize:none;padding:11px 4px;max-height:160px;min-height:42px;line-height:20px;min-width:0}
.cbox .ib{width:40px;height:40px}
#sendBtn{width:46px;height:46px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none;transition:.15s}
#sendBtn svg{margin-left:2px}
#sendBtn:disabled{background:#1d2a35;color:#5d6f7e;cursor:default}
#visitorBar{display:flex;justify-content:center}
#visitorBar button{color:var(--blue);font-weight:500;padding:10px 40px;border-radius:12px}
#visitorBar button:hover{background:#2aabee14}
#emoji{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;margin-bottom:8px;background:var(--panel2);border-radius:14px;max-width:728px;margin-inline:auto}
#emoji button{font-size:22px;padding:5px;border-radius:8px}
#emoji button:hover{background:#ffffff14}

/* ---------- Info panel ---------- */
#info{width:380px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column}
#app.info-open #info{display:flex}
#info .top{gap:10px}
#info .top h3{flex:1;font-weight:500;font-size:17px}
#infoBody{flex:1;overflow-y:auto}
.ihead{display:flex;flex-direction:column;align-items:center;padding:24px 16px 18px;gap:6px}
.ihead h2{font-size:20px;font-weight:500;margin-top:12px;text-align:center;overflow-wrap:anywhere}
.ihead .sub{color:var(--sub);font-size:14px}
.isec{border-top:8px solid #000;padding:6px 0}
.row{display:flex;align-items:center;gap:18px;padding:11px 18px}
.row.act{cursor:pointer}
.row.act:hover{background:var(--hover)}
.row .ri{color:var(--sub);display:grid;place-items:center}
.row .rm{flex:1;min-width:0}
.row .rt{overflow-wrap:anywhere;line-height:1.4;white-space:pre-wrap}
.row .rt a{color:#6cc4f5}
.row .rs{color:var(--sub);font-size:13px;margin-top:2px}
.row.blue .rt,.row.blue .ri{color:var(--blue)}
.sw{width:40px;height:22px;border-radius:11px;background:#333;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on::after{left:20px}

/* ---------- Drawer, menu, modal ---------- */
#scrim{position:fixed;inset:0;background:#0009;z-index:60;opacity:0;pointer-events:none;transition:.2s}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:84%;background:var(--panel);z-index:61;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer.show{transform:none}
.dhead{padding:20px 18px 14px;background:linear-gradient(160deg,#0e2a40,#0a0a0a)}
.dhead .av{width:64px;height:64px;font-size:22px}
.dhead .n{font-weight:500;font-size:17px;margin-top:12px}
.dhead .e{color:var(--sub);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.ditem{display:flex;align-items:center;gap:22px;padding:13px 20px;width:100%;text-align:left}
.ditem:hover{background:var(--hover)}
.ditem svg{color:var(--sub)}
.cm{position:fixed;z-index:95;background:#1a1a1aef;backdrop-filter:blur(14px);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 8px 30px #000c;border:1px solid #262626}
.cm button{display:flex;align-items:center;gap:14px;width:100%;padding:9px 12px;border-radius:8px;text-align:left}
.cm button:hover{background:#ffffff14}
.cm button svg{width:20px;height:20px;color:var(--sub)}
.cm button.danger,.cm button.danger svg{color:var(--danger)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.ov.show{display:flex}
.sheet{background:#101010;border:1px solid #1f1f1f;border-radius:16px;width:100%;max-width:400px;padding:20px;max-height:94%;overflow:auto}
.sheet h3{font-weight:500;font-size:18px;margin-bottom:6px}
.sheet p{color:var(--sub);line-height:1.5}
.pick{position:relative;width:96px;height:96px;margin:10px auto 6px;cursor:pointer;border-radius:50%}
.pick .av{width:96px;height:96px;font-size:34px}
.pick .cam{position:absolute;inset:0;border-radius:50%;background:#0007;display:grid;place-items:center;opacity:0;transition:.15s;color:#fff}
.pick:hover .cam,.pick:focus-visible .cam{opacity:1}
.pick .cb{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:3px solid #101010}
.pick .cb svg{width:16px;height:16px;color:#fff}
.srow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.srow button{padding:10px 18px;border-radius:10px;font-weight:500;color:var(--blue)}
.srow button:hover{background:#2aabee14}
.srow button.pri{background:var(--blue);color:#fff}
.srow button.pri:hover{background:var(--blue-d)}
.srow button.danger{color:var(--danger)}
#viewer{background:#000e;z-index:100;cursor:zoom-out}
#viewer img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1e1e1ef2;padding:10px 18px;border-radius:20px;font-size:14px;z-index:120;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center;border:1px solid #2a2a2a}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  #sidebar{width:100%;border-right:0}
  #chat{display:none;width:100%}
  #app.chat-open #sidebar{display:none}
  #app.chat-open #chat{display:flex}
  #backBtn{display:grid}
  #info{position:fixed;inset:0;z-index:40;width:100%;border-left:0;padding-top:env(safe-area-inset-top,0px)}
  #noChat{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth">
  <div class="acard">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></div>
    <h1>Saluran Liliyana</h1>

    <div id="vChoose">
      <p class="sub">Saluran resmi Liliyana De Zenith.<br>Masuk untuk melihat postingan terbaru.</p>
      <button class="btn" id="btnVisitor">Masuk sebagai Pengunjung</button>
      <button class="btn ghost" id="btnAdminOpen">Masuk sebagai Admin</button>
    </div>

    <div id="vAdmin" hidden>
      <p class="sub">Khusus Liliyana De Zenith.</p>
      <div class="tabs">
        <button id="tabLogin" class="on" type="button">Masuk</button>
        <button id="tabReg" type="button">Daftar</button>
      </div>

      <div id="formLogin">
        <div class="field"><input id="lgId" placeholder=" " autocomplete="username"><label for="lgId">Nama pengguna atau Gmail</label></div>
        <div class="field"><input id="lgPw" type="password" placeholder=" " autocomplete="current-password"><label for="lgPw">Password</label></div>
        <div class="err" id="lgErr" role="alert"></div>
        <button class="btn" id="btnLogin">Masuk</button>
      </div>

      <div id="formReg" hidden>
        <div class="field"><input id="rgUser" placeholder=" " autocomplete="username"><label for="rgUser">Nama pengguna</label></div>
        <div class="field"><input id="rgMail" type="email" placeholder=" " autocomplete="email"><label for="rgMail">Gmail</label></div>
        <div class="field"><input id="rgPw" type="password" placeholder=" " autocomplete="new-password"><label for="rgPw">Password</label></div>
        <div class="err" id="rgErr" role="alert"></div>
        <button class="btn" id="btnReg">Daftar</button>
      </div>
      <button class="btn ghost" id="btnBack">Kembali</button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="shead">
      <button class="ib" id="menuBtn" aria-label="Menu" data-ic="menu"></button>
      <label class="sbox"><span data-ic="search"></span><input id="sideSearch" placeholder="Cari" autocomplete="off"></label>
    </div>
    <div id="list"></div>
  </aside>

  <main id="chat">
    <div id="noChat"><span>Pilih saluran untuk mulai membaca</span></div>
    <div id="chatMain" hidden>
      <div class="top">
        <button class="ib" id="backBtn" aria-label="Kembali" data-ic="back"></button>
        <button class="who" id="whoBtn" aria-label="Info saluran"></button>
        <button class="ib" id="searchBtn" aria-label="Cari pesan" data-ic="search"></button>
        <button class="ib" id="moreBtn" aria-label="Lainnya" data-ic="more"></button>
      </div>
      <div id="searchbar" hidden>
        <input id="msgSearch" placeholder="Cari di saluran" autocomplete="off">
        <span class="cnt" id="msgCnt"></span>
        <button class="ib" id="searchClose" aria-label="Tutup pencarian" data-ic="close"></button>
      </div>
      <div id="pinbar" hidden></div>
      <div id="feed"><div class="wrap" id="feedIn"></div></div>
      <div id="composer"></div>
    </div>
  </main>

  <aside id="info">
    <div class="top">
      <button class="ib" id="infoClose" aria-label="Tutup" data-ic="close"></button>
      <h3>Info Saluran</h3>
      <button class="ib" id="infoEdit" aria-label="Edit saluran" data-ic="edit" hidden></button>
    </div>
    <div id="infoBody"></div>
  </aside>
</div>

<!-- Drawer -->
<div id="scrim"></div>
<nav id="drawer" aria-label="Menu"></nav>

<!-- Modal: edit profil admin -->
<div class="ov" id="mProfile">
  <div class="sheet">
    <h3>Edit profil</h3>
    <div class="pick" id="pfPick" tabindex="0" role="button" aria-label="Ganti foto profil"></div>
    <div class="field"><input id="pfName" placeholder=" " maxlength="40"><label for="pfName">Nama</label></div>
    <div class="field"><input id="pfUser" placeholder=" " maxlength="30"><label for="pfUser">Nama pengguna</label></div>
    <div class="field"><textarea id="pfBio" placeholder=" " maxlength="140"></textarea><label for="pfBio">Bio</label></div>
    <div class="field"><input id="pfMail" placeholder=" " disabled><label for="pfMail">Gmail</label></div>
    <div class="err" id="pfErr" role="alert"></div>
    <div class="srow"><button data-close="mProfile">Batal</button><button class="pri" id="pfSave">Simpan</button></div>
  </div>
</div>

<!-- Modal: edit saluran -->
<div class="ov" id="mChannel">
  <div class="sheet">
    <h3>Edit saluran</h3>
    <div class="pick" id="chPick" tabindex="0" role="button" aria-label="Ganti foto saluran"></div>
    <div class="field"><input id="chName" placeholder=" " maxlength="50"><label for="chName">Nama saluran</label></div>
    <div class="field"><textarea id="chDesc" placeholder=" " maxlength="255"></textarea><label for="chDesc">Deskripsi</label></div>
    <div class="field"><input id="chUser" placeholder=" " maxlength="30"><label for="chUser">Nama pengguna saluran</label></div>
    <div class="err" id="chErr" role="alert"></div>
    <div class="srow"><button data-close="mChannel">Batal</button><button class="pri" id="chSave">Simpan</button></div>
  </div>
</div>

<!-- Modal: konfirmasi -->
<div class="ov" id="mConfirm">
  <div class="sheet">
    <h3 id="cfTitle">Hapus pesan?</h3>
    <p id="cfText">Pesan ini akan dihapus dari saluran untuk semua pengunjung.</p>
    <div class="srow"><button data-close="mConfirm">Batal</button><button class="danger" id="cfOk">Hapus</button></div>
  </div>
</div>

<div class="ov" id="viewer"><img alt="Foto postingan"></div>
<input type="file" id="fileIn" accept="image/*" hidden>

/* ---------- Util ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const MON = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function dayLabel(t) {
  const d = new Date(t), n = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const diff = Math.round((b - a) / 864e5);
  if (diff === 0) return 'Hari ini';
  if (diff === 1) return 'Kemarin';
  return d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== n.getFullYear() ? ' ' + d.getFullYear() : '');
}
function shortTime(t) {
  const d = new Date(t), n = new Date();
  return d.toDateString() === n.toDateString() ? hm(t) : pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
}
const initials = n => (String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('') || '?').toUpperCase();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function linkify(h) { return h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'); }
function fmt(text, q) {
  if (!q) return linkify(esc(text));
  return text.split(new RegExp('(' + escRe(q) + ')', 'ig')).map((part, i) => i % 2 ? '<mark>' + esc(part) + '</mark>' : linkify(esc(part))).join('');
}
function hash(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return String(4294967296 * (2097151 & h2) + (h1 >>> 0));
}
function av(src, name, cls = '', kind = 'ch') {
  const bg = kind === 'ch' ? 'linear-gradient(135deg,#2aabee,#1a73c9)' : 'linear-gradient(135deg,#8f7bf7,#5b47d6)';
  return src ? `<div class="av ${cls}"><img src="${src}" alt=""></div>` : `<div class="av ${cls}" style="background:${bg}">${esc(initials(name))}</div>`;
}
function readImage(file, max = 1280, q = .82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.round(im.width * k), h = Math.round(im.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (_) {} t.remove();
  }
}

/* ---------- State ---------- */
function defState() {
  return {
    channel: { name: 'Saluran Liliyana', username: 'salurankeliliyana', desc: 'Saluran resmi Liliyana De Zenith. Info, update, dan cerita terbaru ada di sini 💙', avatar: '', subs: 1 },

    muted: false

}
function load() { try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.channel && Array.isArray(r.posts)) return r; } catch (e) {} return defState(); }
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { toast('Penyimpanan penuh. Pakai foto yang lebih kecil.'); return false; }
}
let sess = null;

const isAdmin = () => sess && sess.role === 'admin' && !!S.admin;
const me = () => isAdmin() ? { name: S.admin.name, sub: S.admin.gmail, avatar: S.admin.avatar, kind: 'ad' } : { name: 'Pengunjung', sub: 'Hanya bisa melihat saluran', avatar: '', kind: 'ad' };

let searchQ = '', draftImg = '', editingId = null, pinIdx = -1, tmpPf = null, tmpCh = null;

/* ---------- Auth ---------- */
const show = (id, on) => $(id).hidden = !on;
function authView(v) { show('#vChoose', v === 'choose'); show('#vAdmin', v === 'admin'); }
function authTab(t) {
  $('#tabLogin').classList.toggle('on', t === 'login'); $('#tabReg').classList.toggle('on', t === 'reg');
  show('#formLogin', t === 'login'); show('#formReg', t === 'reg');
  $('#lgErr').textContent = ''; $('#rgErr').textContent = '';
}
$('#btnVisitor').onclick = () => {
  sess = { role: 'visitor' }; localStorage.setItem(SES, JSON.stringify(sess));
  if (!localStorage.getItem(SUBFLAG)) { S.channel.subs = (S.channel.subs || 0) + 1; localStorage.setItem(SUBFLAG, '1'); save(); }
  enterApp();
};
$('#btnAdminOpen').onclick = () => { authView('admin'); authTab(S.admin ? 'login' : 'reg'); };
$('#btnBack').onclick = () => authView('choose');
$('#tabLogin').onclick = () => authTab('login');
$('#tabReg').onclick = () => authTab('reg');
$('#btnReg').onclick = () => {
  const user = $('#rgUser').value.trim(), mail = $('#rgMail').value.trim().toLowerCase(), pw = $('#rgPw').value, err = $('#rgErr');
  if (S.admin) { err.textContent = 'Admin sudah terdaftar. Silakan masuk.'; return; }
  if (!/^[a-zA-Z0-9_.]{3,30}$/.test(user)) { err.textContent = 'Nama pengguna 3–30 karakter: huruf, angka, titik, atau garis bawah.'; return; }
  if (!/^[^\s@]+@gmail\.com$/.test(mail)) { err.textContent = 'Gunakan alamat Gmail yang valid, contoh nama@gmail.com.'; return; }
  if (pw !== OWNER_PASS) { err.textContent = 'Password salah. Password ini khusus untuk admin saluran.'; return; }
  S.admin = { username: user, gmail: mail, hash: hash(pw), name: 'Liliyana De Zenith', bio: '', avatar: '' };
  if (!save()) { S.admin = null; return; }
  authTab('login'); $('#lgId').value = user; $('#lgPw').focus(); toast('Pendaftaran berhasil. Silakan masuk.');
};
$('#btnLogin').onclick = () => {
  const id = $('#lgId').value.trim().toLowerCase(), pw = $('#lgPw').value, err = $('#lgErr');
  if (!S.admin) { err.textContent = 'Belum ada admin terdaftar. Buka tab Daftar dulu.'; return; }
  const a = S.admin;
  if ((id !== a.username.toLowerCase() && id !== a.gmail.toLowerCase()) || hash(pw) !== a.hash) { err.textContent = 'Nama pengguna/Gmail atau password salah.'; return; }
  sess = { role: 'admin' }; localStorage.setItem(SES, JSON.stringify(sess));
  enterApp(true);
};
['#lgId', '#lgPw'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); }));
['#rgUser', '#rgMail', '#rgPw'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnReg').click(); }));

function logout() {
  sess = null; localStorage.removeItem(SES);

  $('#lgPw').value = ''; $('#rgPw').value = ''; authView('choose'); cancelEdit(); searchClose();
}

/* ---------- Render ---------- */
let chatOpen = false;

  $('#auth').hidden = true; $('#app').hidden = false;
  if (window.innerWidth > 820) openChat();
  renderAll();
  if (first) toast('Klik kanan atau tahan sebuah pesan untuk edit, sematkan, atau hapus');

function renderAll() { renderSide(); renderHead(); renderPin(); renderFeed(); renderComposer(); renderInfo(); renderDrawer(); }

function lastPost() { return [...S.posts].sort((a, b) => b.ts - a.ts)[0]; }
function renderSide() {
  const q = $('#sideSearch').value.trim().toLowerCase(), c = S.channel, lp = lastPost();
  if (q && !c.name.toLowerCase().includes(q)) { $('#list').innerHTML = '<div class="empty">Tidak ada hasil</div>'; return; }
  const pv = lp ? (lp.text ? lp.text.replace(/\s+/g, ' ') : 'Foto') : 'Belum ada postingan';
  $('#list').innerHTML = `<div class="ci ${chatOpen ? 'active' : ''}" id="ci" role="button" tabindex="0">
    ${av(c.avatar, c.name)}
    <div class="mid">
      <div class="r1"><div class="nm">${icon('mega')}<span style="overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</span>${S.muted ? icon('bellOff') : ''}</div><div class="tm">${lp ? shortTime(lp.ts) : ''}</div></div>
      <div class="pv">${esc(pv)}</div>
    </div></div>`;
}
function renderHead() {
  const c = S.channel;
  $('#whoBtn').innerHTML = `${av(c.avatar, c.name, 's')}<div class="t"><div class="nm">${esc(c.name)}</div><div class="st">${c.subs} pelanggan</div></div>`;
}
function pinned() { return S.posts.filter(p => p.pinned).sort((a, b) => a.ts - b.ts); }
function renderPin() {
  const ps = pinned(), bar = $('#pinbar');
  if (!ps.length) { bar.hidden = true; return; }
  if (pinIdx < 0 || pinIdx >= ps.length) pinIdx = ps.length - 1;
  const p = ps[pinIdx];
  bar.hidden = false;
  bar.innerHTML = `<div class="bar"></div><div class="pm"><div class="pt">Pesan yang disematkan${ps.length > 1 ? ' #' + (pinIdx + 1) : ''}</div><div class="px">${esc(p.text ? p.text.replace(/\s+/g, ' ') : 'Foto')}</div></div>${isAdmin() ? `<button class="ib" data-act="unpinBar" aria-label="Lepas sematan">${icon('close')}</button>` : ''}`;
}
function countViews() {
  if (isAdmin()) return;
  let seen = []; try { seen = JSON.parse(localStorage.getItem(SEEN)) || []; } catch (e) {}
  let ch = false;
  S.posts.forEach(p => { if (!seen.includes(p.id)) { p.views = (p.views || 0) + 1; seen.push(p.id); ch = true; } });
  if (ch) { localStorage.setItem(SEEN, JSON.stringify(seen)); save(); }
}
function postHTML(p) {
  return `<div class="msg" data-id="${p.id}"><div class="bubble ${p.img ? 'has-img' : ''}">
    ${p.img ? `<img class="pimg" src="${p.img}" alt="Foto postingan" data-act="viewImg">` : ''}

    <div class="meta">${p.pinned ? `<span class="pn">${icon('pin')}</span>` : ''}${p.edited ? '<span>diedit</span>' : ''}<span style="display:flex;align-items:center;gap:3px">${icon('eye')}${p.views || 0}</span><span>${hm(p.ts)}</span></div>
  </div></div>`;
}
function renderFeed(stick) {
  const feed = $('#feed'), atBottom = stick || feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  let posts = [...S.posts].sort((a, b) => a.ts - b.ts);
  if (searchQ) posts = posts.filter(p => (p.text || '').toLowerCase().includes(searchQ.toLowerCase()));
  $('#msgCnt').textContent = searchQ ? posts.length + ' hasil' : '';
  let html = '', last = '';
  if (!posts.length) html = `<div class="empty">${searchQ ? 'Tidak ada pesan yang cocok' : 'Belum ada postingan' + (isAdmin() ? '. Tulis yang pertama di bawah.' : '.')}</div>`;
  posts.forEach(p => { const d = dayLabel(p.ts); if (d !== last) { html += `<div class="day"><span>${d}</span></div>`; last = d; } html += postHTML(p); });
  $('#feedIn').innerHTML = html;
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

  const box = $('#composer');
  if (!isAdmin()) {
    box.innerHTML = `<div id="visitorBar"><button data-act="toggleMute">${S.muted ? 'Bunyikan' : 'Bisukan'}</button></div>`;
    return;
  }
  const keep = box.querySelector('textarea') ? box.querySelector('textarea').value : '';
  box.innerHTML = `<div class="cwrap">
    <div id="emoji" hidden></div>
    <div id="editBar" hidden><div class="bar"></div><div class="et"><b>Edit pesan</b><span></span></div><button class="ib" data-act="cancelEdit" aria-label="Batal edit">${icon('close')}</button></div>

    <div class="crow">
      <div class="cbox">
        <button class="ib" data-act="emoji" aria-label="Emoji">${icon('smile')}</button>

      </div>
      <button id="sendBtn" data-act="send" aria-label="Kirim" disabled>${icon('send')}</button>
    </div></div>`;
  const ta = $('#ta'); ta.value = keep;
  const em = '😀 😂 🥰 😍 😎 🤩 😭 🥺 😡 👍 👏 🙏 💙 🔥 ✨ 🎉 💯 🌙 ⭐ 🌸 🍀 ☕ 🎶 📸 ✈️ 💌 🫶 🤍 🖤 😴 🤔 👀'.split(' ');
  $('#emoji').innerHTML = em.map(e => `<button type="button" data-emo="${e}">${e}</button>`).join('');
  ta.addEventListener('input', () => { grow(); syncSend(); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); sendPost(); } });
  syncDraft(); grow(); syncSend();
}
function grow() { const t = $('#ta'); if (!t) return; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
function syncSend() { const t = $('#ta'); if (t) $('#sendBtn').disabled = !(t.value.trim() || draftImg); }
function syncDraft() {
  const ip = $('#imgPrev'); if (!ip) return;
  ip.hidden = !draftImg; if (draftImg) ip.querySelector('img').src = draftImg;
  const eb = $('#editBar'), p = editingId && S.posts.find(x => x.id === editingId);
  eb.hidden = !p; if (p) eb.querySelector('span').textContent = (p.text || 'Foto').replace(/\s+/g, ' ');
  $('#attachBtn').hidden = !!editingId;
}
function renderInfo() {
  const c = S.channel, a = S.admin, photos = S.posts.filter(p => p.img).length;
  $('#infoEdit').hidden = !isAdmin();
  $('#infoBody').innerHTML = `
  <div class="ihead">${av(c.avatar, c.name, 'xl')}<h2>${esc(c.name)}</h2><div class="sub">${c.subs} pelanggan</div></div>
  <div class="isec">
    <div class="row"><span class="ri">${icon('info')}</span><div class="rm"><div class="rt">${c.desc ? linkify(esc(c.desc)) : '—'}</div><div class="rs">Deskripsi</div></div></div>
    <div class="row act" data-act="copyChLink" role="button" tabindex="0"><span class="ri">${icon('link')}</span><div class="rm"><div class="rt">@${esc(c.username)}</div><div class="rs">Nama pengguna. Ketuk untuk salin link</div></div></div>
    <div class="row act" data-act="toggleMute" role="button" tabindex="0"><span class="ri">${icon(S.muted ? 'bellOff' : 'bell')}</span><div class="rm"><div class="rt">Notifikasi</div><div class="rs">${S.muted ? 'Dibisukan' : 'Aktif'}</div></div><div class="sw ${S.muted ? '' : 'on'}"></div></div>
  </div>
  <div class="isec">
    <div class="row"><span class="ri">${a ? av(a.avatar, a.name, 's', 'ad') : icon('person')}</span><div class="rm"><div class="rt">${esc(a ? a.name : 'Liliyana De Zenith')}</div><div class="rs">Pemilik saluran${a && a.username ? ' • @' + esc(a.username) : ''}</div></div></div>
    ${a && a.bio ? `<div class="row"><span class="ri">${icon('info')}</span><div class="rm"><div class="rt">${esc(a.bio)}</div><div class="rs">Bio</div></div></div>` : ''}
  </div>
  <div class="isec">
    <div class="row"><span class="ri">${icon('image')}</span><div class="rm"><div class="rt">${photos} foto</div><div class="rs">Media</div></div></div>
    <div class="row act" data-act="shareCh" role="button" tabindex="0"><span class="ri">${icon('share')}</span><div class="rm"><div class="rt">Bagikan saluran</div></div></div>
    ${isAdmin() ? `<div class="row act blue" data-act="editCh" role="button" tabindex="0"><span class="ri">${icon('edit')}</span><div class="rm"><div class="rt">Edit saluran</div></div></div>` : ''}
  </div>`;
}
function renderDrawer() {
  const m = me(), adm = isAdmin();
  $('#drawer').innerHTML = `
  <div class="dhead">${av(m.avatar, m.name, '', 'ad')}<div class="n">${esc(m.name)}</div><div class="e">${esc(m.sub)}</div></div>
  <div style="flex:1;overflow:auto;padding:6px 0">
    <button class="ditem" data-act="openFromDrawer">${icon('mega')}<span>Saluran Liliyana</span></button>
    ${adm ? `<button class="ditem" data-act="editProfile">${icon('person')}<span>Profil saya</span></button>
    <button class="ditem" data-act="editCh">${icon('edit')}<span>Edit saluran</span></button>` : ''}
    <button class="ditem" data-act="shareCh">${icon('share')}<span>Bagikan saluran</span></button>
    <button class="ditem" data-act="logout">${icon('logout')}<span>Keluar</span></button>
  </div>`;
}

/* ---------- Chat open/close ---------- */
function openChat() {
  chatOpen = true; $('#app').classList.add('chat-open'); show('#noChat', false); show('#chatMain', true);
  countViews(); renderAll(); $('#feed').scrollTop = $('#feed').scrollHeight;
  if (location.hash.startsWith('#post-')) setTimeout(() => scrollToPost(location.hash.slice(6)), 100);
}
function closeChat() { chatOpen = false; $('#app').classList.remove('chat-open', 'info-open'); if (window.innerWidth > 820) { show('#noChat', true); show('#chatMain', false); } renderSide(); }
function scrollToPost(id) {
  const el = $(`.msg[data-id="${id}"]`); if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300);
}
function searchOpen() { show('#searchbar', true); $('#msgSearch').focus(); }
function searchClose() { show('#searchbar', false); $('#msgSearch').value = ''; if (searchQ) { searchQ = ''; renderFeed(); } }
$('#msgSearch').addEventListener('input', e => { searchQ = e.target.value.trim(); renderFeed(); });
$('#searchBtn').onclick = () => $('#searchbar').hidden ? searchOpen() : searchClose();
$('#searchClose').onclick = searchClose;
$('#sideSearch').addEventListener('input', renderSide);
$('#backBtn').onclick = closeChat;
$('#whoBtn').onclick = () => $('#app').classList.toggle('info-open');
$('#infoClose').onclick = () => $('#app').classList.remove('info-open');
$('#infoEdit').onclick = () => openChannelModal();
$('#list').addEventListener('click', e => { if (e.target.closest('#ci')) openChat(); });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('#ci')) openChat(); });

/* ---------- Drawer ---------- */
function openDrawer() { renderDrawer(); $('#drawer').classList.add('show'); $('#scrim').classList.add('show'); }
function closeDrawer() { $('#drawer').classList.remove('show'); $('#scrim').classList.remove('show'); }
$('#menuBtn').onclick = openDrawer;
$('#scrim').onclick = closeDrawer;

/* ---------- Menu konteks ---------- */
let lastMenu = 0;
function closeMenu() { const m = $('.cm'); if (m) m.remove(); }
function openMenu(id, x, y) {
  closeMenu();
  const p = S.posts.find(p => p.id === id); if (!p) return;
  const it = [];
  if (p.text) it.push(['copy', 'Salin teks', 'copyText']);
  it.push(['link', 'Salin link pesan', 'copyLink']);
  if (isAdmin()) {
    it.push(['pin', p.pinned ? 'Lepas sematan' : 'Sematkan', 'pin']);
    it.push(['edit', 'Edit', 'edit']);
    it.push(['del', 'Hapus', 'del', 'danger']);
  }
  const m = document.createElement('div'); m.className = 'cm'; m.setAttribute('role', 'menu');
  m.innerHTML = it.map(([ic, lb, act, cl]) => `<button role="menuitem" class="${cl || ''}" data-m="${act}">${icon(ic)}<span>${lb}</span></button>`).join('');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  lastMenu = Date.now();
  m.onclick = e => {
    const b = e.target.closest('[data-m]'); if (!b) return; closeMenu();
    const a = b.dataset.m;
    if (a === 'copyText') { copy(p.text); toast('Teks disalin'); }
    if (a === 'copyLink') { copy(baseUrl() + '#post-' + p.id); toast('Link pesan disalin'); }
    if (a === 'pin') { p.pinned = !p.pinned; save(); pinIdx = -1; renderPin(); renderFeed(); toast(p.pinned ? 'Pesan disematkan' : 'Sematan dilepas'); }
    if (a === 'edit') startEdit(p.id);
    if (a === 'del') confirmDelete(p.id);
  };
}
document.addEventListener('contextmenu', e => {
  const m = e.target.closest('.msg');
  if (m) { e.preventDefault(); if (Date.now() - lastMenu > 600) openMenu(m.dataset.id, e.clientX, e.clientY); }
});
let lpT, lpX, lpY;
$('#feed').addEventListener('touchstart', e => {
  const m = e.target.closest('.msg'); if (!m) return;
  const t = e.touches[0]; lpX = t.clientX; lpY = t.clientY;
  lpT = setTimeout(() => openMenu(m.dataset.id, lpX, lpY), 480);
}, { passive: true });
['touchend', 'touchcancel', 'touchmove'].forEach(ev => $('#feed').addEventListener(ev, () => clearTimeout(lpT), { passive: true }));
document.addEventListener('click', e => { if (!e.target.closest('.cm')) closeMenu(); });
$('#moreBtn').onclick = e => {
  e.stopPropagation(); closeMenu();
  const r = e.currentTarget.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'cm';
  m.innerHTML = `<button data-m="info">${icon('info')}<span>Info saluran</span></button><button data-m="mute">${icon(S.muted ? 'bell' : 'bellOff')}<span>${S.muted ? 'Bunyikan' : 'Bisukan'}</span></button><button data-m="share">${icon('share')}<span>Bagikan saluran</span></button>`;
  document.body.appendChild(m);
  const w = m.getBoundingClientRect().width;
  m.style.top = r.bottom + 4 + 'px'; m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.onclick = ev => {
    const b = ev.target.closest('[data-m]'); if (!b) return; closeMenu();
    if (b.dataset.m === 'info') $('#app').classList.add('info-open');
    if (b.dataset.m === 'mute') toggleMute();
    if (b.dataset.m === 'share') shareCh();
  };
};

/* ---------- Aksi ---------- */
function toggleMute() { S.muted = !S.muted; save(); renderAll(); toast(S.muted ? 'Notifikasi dibisukan' : 'Notifikasi diaktifkan'); }
async function shareCh() {
  closeDrawer();
  const url = baseUrl();
  if (navigator.share) { try { await navigator.share({ title: S.channel.name, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copy(url); toast('Link saluran disalin');
}
function startEdit(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  editingId = id; draftImg = ''; syncDraft();
  const ta = $('#ta'); ta.value = p.text || ''; grow(); syncSend(); ta.focus();
}
function cancelEdit() { editingId = null; draftImg = ''; const ta = $('#ta'); if (ta) { ta.value = ''; grow(); } syncDraft(); syncSend(); }
function sendPost() {
  if (!isAdmin()) return;
  const text = $('#ta').value.trim();
  if (editingId) {
    const p = S.posts.find(x => x.id === editingId);
    if (!p) { cancelEdit(); return; }
    if (!text && !p.img) { toast('Pesan tidak boleh kosong'); return; }
    p.text = text; p.edited = true;
    if (!save()) return;
    editingId = null; $('#ta').value = ''; grow(); syncDraft(); syncSend(); renderAll(); toast('Pesan diperbarui'); return;
  }
  if (!text && !draftImg) return;
  S.posts.push({ id: uid(), text, img: draftImg, ts: Date.now(), edited: false, views: 0, pinned: false });
  if (!save()) { S.posts.pop(); return; }
  draftImg = ''; $('#ta').value = ''; $('#emoji').hidden = true; grow(); syncDraft(); syncSend();
  renderSide(); renderPin(); renderFeed(true); renderInfo();
}
let cfAction = null;
function confirmDelete(id) { cfAction = () => { S.posts = S.posts.filter(p => p.id !== id); if (editingId === id) cancelEdit(); save(); pinIdx = -1; renderAll(); toast('Pesan dihapus'); }; openModal('mConfirm'); }
$('#cfOk').onclick = () => { closeModal('mConfirm'); if (cfAction) cfAction(); cfAction = null; };

/* ---------- Modal ---------- */
function openModal(id) { $('#' + id).classList.add('show'); }
function closeModal(id) { $('#' + id).classList.remove('show'); }
$$('[data-close]').forEach(b => b.onclick = () => closeModal(b.dataset.close));
$$('.ov').forEach(o => o.addEventListener('mousedown', e => { if (e.target === o) closeModal(o.id); }));
$('#viewer').onclick = () => closeModal('viewer');

function pickAvatar(cb) {
  const f = $('#fileIn'); f.value = '';
  f.onchange = async () => { const file = f.files[0]; if (!file) return; try { cb(await readImage(file, 480, .85)); } catch (e) { toast('Foto tidak bisa dibaca'); } };
  f.click();
}
function paintPick(el, src, name, kind) { el.innerHTML = av(src, name, '', kind) + `<div class="cam">${icon('camera')}</div><div class="cb">${icon('camera')}</div>`; }

function openProfileModal() {
  if (!isAdmin()) return; closeDrawer();
  const a = S.admin; tmpPf = a.avatar || '';
  $('#pfName').value = a.name; $('#pfUser').value = a.username; $('#pfBio').value = a.bio || ''; $('#pfMail').value = a.gmail; $('#pfErr').textContent = '';
  paintPick($('#pfPick'), tmpPf, a.name, 'ad'); openModal('mProfile');
}
const pfPickGo = () => pickAvatar(d => { tmpPf = d; paintPick($('#pfPick'), tmpPf, $('#pfName').value || 'L', 'ad'); });
$('#pfPick').onclick = pfPickGo; $('#pfPick').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pfPickGo(); } };
$('#pfSave').onclick = () => {
  const name = $('#pfName').value.trim(), user = $('#pfUser').value.trim(), bio = $('#pfBio').value.trim(), err = $('#pfErr');
  if (!name) { err.textContent = 'Nama tidak boleh kosong.'; return; }
  if (!/^[a-zA-Z0-9_.]{3,30}$/.test(user)) { err.textContent = 'Nama pengguna 3–30 karakter: huruf, angka, titik, atau garis bawah.'; return; }
  const old = { ...S.admin };
  Object.assign(S.admin, { name, username: user, bio, avatar: tmpPf });
  if (!save()) { S.admin = old; return; }
  closeModal('mProfile'); renderAll(); toast('Profil diperbarui');
};
function openChannelModal() {
  if (!isAdmin()) return; closeDrawer();
  const c = S.channel; tmpCh = c.avatar || '';
  $('#chName').value = c.name; $('#chDesc').value = c.desc || ''; $('#chUser').value = c.username; $('#chErr').textContent = '';
  paintPick($('#chPick'), tmpCh, c.name, 'ch'); openModal('mChannel');
}
const chPickGo = () => pickAvatar(d => { tmpCh = d; paintPick($('#chPick'), tmpCh, $('#chName').value || 'S', 'ch'); });
$('#chPick').onclick = chPickGo; $('#chPick').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chPickGo(); } };
$('#chSave').onclick = () => {
  const name = $('#chName').value.trim(), desc = $('#chDesc').value.trim(), user = $('#chUser').value.trim().replace(/^@/, ''), err = $('#chErr');
  if (!name) { err.textContent = 'Nama saluran tidak boleh kosong.'; return; }
  if (!/^[a-zA-Z0-9_]{3,30}$/.test(user)) { err.textContent = 'Nama pengguna saluran 3–30 karakter: huruf, angka, atau garis bawah.'; return; }
  const old = { ...S.channel };
  Object.assign(S.channel, { name, desc, username: user, avatar: tmpCh });
  if (!save()) { S.channel = old; return; }
  closeModal('mChannel'); renderAll(); toast('Saluran diperbarui');
};

/* ---------- Delegasi klik ---------- */
document.addEventListener('click', e => {
  const emo = e.target.closest('[data-emo]');
  if (emo) { const t = $('#ta'), s = t.selectionStart ?? t.value.length, en = t.selectionEnd ?? s; t.value = t.value.slice(0, s) + emo.dataset.emo + t.value.slice(en); t.focus(); t.selectionStart = t.selectionEnd = s + emo.dataset.emo.length; grow(); syncSend(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'send') sendPost();
  else if (a === 'emoji') { const em = $('#emoji'); em.hidden = !em.hidden; }
  else if (a === 'attach') { const f = $('#fileIn'); f.value = ''; f.onchange = async () => { const file = f.files[0]; if (!file) return; try { draftImg = await readImage(file); syncDraft(); syncSend(); } catch (er) { toast('Foto tidak bisa dibaca'); } }; f.click(); }
  else if (a === 'rmImg') { draftImg = ''; syncDraft(); syncSend(); }
  else if (a === 'cancelEdit') cancelEdit();
  else if (a === 'toggleMute') toggleMute();
  else if (a === 'copyChLink') { copy(baseUrl()); toast('Link saluran disalin'); }
  else if (a === 'shareCh') shareCh();
  else if (a === 'editCh') openChannelModal();
  else if (a === 'editProfile') openProfileModal();
  else if (a === 'logout') logout();
  else if (a === 'openFromDrawer') { closeDrawer(); openChat(); }
  else if (a === 'viewImg') { $('#viewer img').src = b.src; openModal('viewer'); }
  else if (a === 'unpinBar') { e.stopPropagation(); const p = pinned()[pinIdx]; if (p) { p.pinned = false; save(); pinIdx = -1; renderPin(); renderFeed(); toast('Sematan dilepas'); } }
});
$('#pinbar').addEventListener('click', e => {
  if (e.target.closest('[data-act]')) return;
  const ps = pinned(); if (!ps.length) return;
  scrollToPost(ps[pinIdx].id); pinIdx = (pinIdx - 1 + ps.length) % ps.length; renderPin();
});
$('#info').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-act]')) e.target.click(); });

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeMenu(); closeDrawer();
  $$('.ov.show').forEach(o => o.classList.remove('show'));
  if (editingId) cancelEdit();
  else if (!$('#searchbar').hidden) searchClose();
  else $('#app').classList.remove('info-open');
});
window.addEventListener('resize', () => { if (!$('#app').hidden && innerWidth > 820 && !chatOpen) openChat(); });

/* ---------- Boot ---------- */
if (sess && (sess.role === 'visitor' || (sess.role === 'admin' && S.admin))) enterApp();
else { sess = null; authView('choose'); }
})();
</script>
</body>
</html>
